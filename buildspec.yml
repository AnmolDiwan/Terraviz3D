version: 0.2

phases:
  pre_build:
    commands:
      - echo "==> Logging in to Amazon ECR..."
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 530540751051.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=530540751051.dkr.ecr.us-east-1.amazonaws.com/terraviz-backend
      - IMAGE_TAG=latest
  build:
    commands:
      - echo "==> Building Docker image for TerraViz3D..."
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG -f backend/Dockerfile backend
  post_build:
    commands:
      - echo "==> Pushing Docker image to Amazon ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "==> Triggering ECS rolling deployment..."
      - aws ecs update-service --cluster terraviz3d-cluster-production --service terraviz3d-backend-svc --force-new-deployment --region us-east-1
      - echo "==> Deployment initiated successfully!"
