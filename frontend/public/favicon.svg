<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background & Sphere Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070e1e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="globeGrad" cx="30" cy="28" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f2044"/>
      <stop offset="100%" stop-color="#081024"/>
    </radialGradient>
    <linearGradient id="atmoGlow" x1="20" y1="12" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="seismicGlow" cx="42" cy="24" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fb923c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Container (Clean Squircle for Modern Browser Tabs) -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1"/>

  <!-- Atmosphere Rim Glow -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="url(#atmoGlow)" stroke-width="1.8" opacity="0.85" filter="url(#glow)"/>

  <!-- 3D Earth Globe Body -->
  <circle cx="32" cy="32" r="21" fill="url(#globeGrad)"/>

  <!-- Geospatial Coordinate Grid (Parallels & Meridians) -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.35" fill="none">
    <!-- Equator and Parallels -->
    <line x1="11" y1="32" x2="53" y2="32"/>
    <ellipse cx="32" cy="32" rx="21" ry="9" stroke-dasharray="2 1.5"/>
    <ellipse cx="32" cy="32" rx="21" ry="16"/>
    <!-- Meridians -->
    <ellipse cx="32" cy="32" rx="9" ry="21"/>
    <ellipse cx="32" cy="32" rx="16" ry="21" stroke-dasharray="2 1.5"/>
    <line x1="32" y1="11" x2="32" y2="53"/>
  </g>

  <!-- Stylized Tectonic / Land Contour Elements -->
  <path d="M22 22c2-3 5-4 7-2 1.5 1.5 1 4 3 5 2 .8 4-.5 5 1 .8 1.2.2 2.5-1 3.5-2 1.5-5 1-6 3-1 2-2 4-4 4s-3-2-4-4c-.8-1.5-1-3.5 0-5.5.8-1.5-.5-3.5 0-5z" fill="#0284c7" opacity="0.4"/>
  <path d="M38 35c2-1 4 0 5 2 1.2 2.5 0 5-2 6-2 1-3 0-4-1-1.2-1.2-1-3 0-5s-.5-1.5 1-2z" fill="#0284c7" opacity="0.45"/>

  <!-- Seismic Epicenter Pulse (Earthquake Intelligence Indicator) -->
  <circle cx="42" cy="24" r="9" fill="url(#seismicGlow)"/>
  <circle cx="42" cy="24" r="6" fill="none" stroke="#f43f5e" stroke-width="0.85" opacity="0.8" stroke-dasharray="1.5 1"/>
  <circle cx="42" cy="24" r="3.2" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.95"/>
  <circle cx="42" cy="24" r="1.5" fill="#ffffff" filter="url(#glow)"/>

  <!-- Orbital Data Trajectory Ring (3D Geospatial Arc) -->
  <path d="M12 38 C 16 48, 48 48, 52 38" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <circle cx="50" cy="39" r="1.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="14" cy="39" r="1" fill="#60a5fa"/>
</svg>
